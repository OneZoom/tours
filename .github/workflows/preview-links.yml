name: Comment tour preview links

on:
  check_run:
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.check_run.conclusion == 'success' &&
      startsWith(github.event.check_run.name, 'Workers Builds')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Comment with a preview link per changed tour
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/preview_links.py
