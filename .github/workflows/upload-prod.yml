name: Upload tours to production

on:
  push:
    branches:
      - production

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Upload tour JSON to OneZoom production
        env:
          UPLOAD_USER: ${{ secrets.UPLOAD_USER }}
          UPLOAD_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
        run: python upload.py https://www.onezoom.org *.json --user "$UPLOAD_USER" --password "$UPLOAD_PASSWORD"
